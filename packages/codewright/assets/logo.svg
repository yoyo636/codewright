<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 512" fill="none">
  <defs>
    <linearGradient id="triangle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF5A3C"/>
      <stop offset="100%" stop-color="#C81E2E"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E2A3A"/>
      <stop offset="100%" stop-color="#3A4A5E"/>
    </linearGradient>
  </defs>

  <!--
    Codewright logo. Horizontal lockup: mark + wordmark.

    The mark fuses the three brand elements into one glyph:
      - sharp triangle  : forward arrowhead of execution (the "run" affordance)
      - horizontal bar  : the connection edge of the trajectory graph
      - letter R         : the brand initial

    The triangle is the arrowhead, the bar is its trailing shaft, and the R
    is built onto the shaft's end — the shaft doubles as the R's crossbar.
    Read left-to-right the glyph resolves as both "▶—R" and a single monogram.
  -->

  <!-- ===== MARK ===== -->
  <g transform="translate(60, 0)">
    <!-- Sharp triangle: right-pointing arrowhead -->
    <polygon
      points="20,120 20,392 200,256"
      fill="url(#triangle)"
      stroke="#1E2A3A"
      stroke-width="6"
      stroke-linejoin="round"
    />

    <!-- Horizontal bar: trailing shaft from the arrowhead -->
    <rect x="200" y="248" width="150" height="16" rx="8" fill="url(#bar)"/>

    <!-- Letter R: stem fuses to the bar's end; bowl + leg complete the glyph -->
    <path
      d="M 350 120 V 392"
      fill="none"
      stroke="#1E2A3A"
      stroke-width="24"
      stroke-linecap="round"
    />
    <path
      d="M 350 120 H 418 A 68 68 0 0 1 418 256 H 350"
      fill="none"
      stroke="#1E2A3A"
      stroke-width="24"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M 418 256 L 478 392"
      fill="none"
      stroke="#1E2A3A"
      stroke-width="24"
      stroke-linecap="round"
    />
  </g>

  <!-- ===== WORDMARK ===== -->
  <g transform="translate(620, 140)">
    <text x="0" y="110"
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
          font-size="128" font-weight="700" fill="#1E2A3A" letter-spacing="-6">
      codewright
    </text>
    <text x="0" y="180"
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
          font-size="34" font-weight="500" fill="#6B7280" letter-spacing="10">
      EXECUTION GRAPH ENGINE
    </text>
  </g>
</svg>