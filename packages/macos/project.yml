name: Codewright
options:
  bundleIdPrefix: com.codewright
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.codewright.macos
    INFOPLIST_FILE: Sources/Codewright/Info.plist
    ENABLE_HARDENED_RUNTIME: true
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    COMBINE_HIDPI_IMAGES: true
targets:
  Codewright:
    type: application
    platform: macOS
    sources:
      - path: Sources/Codewright
    info:
      path: Sources/Codewright/Info.plist
      properties:
        CFBundleName: Codewright
        CFBundleDisplayName: Codewright
        CFBundleIdentifier: com.codewright.macos
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        LSMinimumSystemVersion: "14.0"
        NSHighResolutionCapable: true
        NSMainStoryboardFile: ""
        NSPrincipalClass: NSApplication
